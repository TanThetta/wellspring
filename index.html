    <script>
      // Seamless Live Server & static server support
      // If opened directly with VS Code "Go Live" (port 5500 or 5501) or file://, redirect to compiled dist/
      (function() {
        var isLiveServer = window.location.port === '5500' || window.location.port === '5501' || window.location.protocol === 'file:';
        if (isLiveServer && !window.location.pathname.includes('/dist/')) {
          window.location.replace('./dist/index.html');
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
